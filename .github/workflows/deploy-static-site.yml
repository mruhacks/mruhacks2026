name: Deploy Static Site

# Builds the static export of the public pages (`pnpm build:static`) from the
# production database and deploys it to Cloudflare as the
# `mruhacks-static-site` Worker. Manual only. See docs/STATIC_EXPORT.md.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-static-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      # Read at build time only: the podium, the gallery and every project page.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Where cover and write-up images load from, as on the live site.
      S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
      # Fake, as in ci.yml: the data layer imports Better Auth, which reads
      # these at import time. The export has no server, so nothing uses them.
      BETTER_AUTH_SECRET: static-export-build-only-not-a-secret
      BETTER_AUTH_URL: https://mruhacks.ca
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build:static

      - name: Deploy to Cloudflare
        working-directory: workers/static-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 deploy

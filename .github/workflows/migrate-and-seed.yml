name: Migrate & Seed Static Data

on:
  push:
    branches:
      - test
      - main

jobs:
  # Production only: capture a restorable dump before the schema changes under
  # us. If this fails, the migration below never runs.
  backup:
    if: github.ref_name == 'main'
    uses: ./.github/workflows/db-backup.yml
    secrets: inherit

  migrate-and-seed:
    needs: backup
    # `needs` alone would skip this job on the test branch, where backup itself
    # is skipped — so accept 'skipped' explicitly and block only on failure.
    if: >-
      ${{ !cancelled()
      && (needs.backup.result == 'success' || needs.backup.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'Test' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Log environment
        run: echo "Using environment:\ ${{ github.ref_name == 'main' && 'production' || 'Test' }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm drizzle-kit migrate

      - name: Seed static data
        run: pnpm tsx scripts/seed-static.ts

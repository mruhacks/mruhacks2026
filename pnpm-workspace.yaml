overrides:
  react-hook-form: ^7.65.0
  '@hookform/resolvers': ^5.2.2
  esbuild: ^0.28.2
  js-yaml: ^4.3.2
  joi: ^17.13.9
  zod@<4.6.6: ^4.6.7

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - unrs-resolver

# 72-hour cooldown: ignore package versions published less than 3 days ago
minimumReleaseAge: 4320

resolutionMode: highest

allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  sharp: true
  ssh2: true
  unrs-resolver: true

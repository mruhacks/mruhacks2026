auditConfig:
  ignoreGhsas:
    # node-forge RSA PKCS#1 v1.5 signature *verification* bypass. No patched
    # release is published yet (latest is 1.4.0). Only reached via
    # passkit-generator, which uses node-forge to sign passes, never to verify.
    - GHSA-86w9-cpqp-85rv
    # braces stack-exhaustion DoS on deeply nested patterns. No patched release
    # is published yet (latest is 3.0.3). Only reached via dev tooling (vercel
    # CLI, eslint) matching our own repo globs, never untrusted input.
    - GHSA-vfj7-8cjw-p6xm

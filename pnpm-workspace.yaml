overrides:
  react-hook-form: ^7.65.0
  '@hookform/resolvers': ^5.2.2
  esbuild: ^0.28.2
  js-yaml: ^4.3.1
  sharp: ^0.35.5
  joi: ^17.13.7
  undici@<6.28.1: ^6.28.1
  tar@<7.5.21: ^7.5.21
  path-to-regexp@>=4 <6.3.0: ^6.3.0
  path-to-regexp@>=8 <8.4.0: ^8.4.0
  minimatch@>=10 <10.2.3: ^10.2.3
  smol-toml@<1.8.1: ^1.9.0
  ajv@>=7 <8.18.0: ^8.18.0
  '@tootallnate/once@<2.0.1': ^2.0.1

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - unrs-resolver

# 72-hour cooldown: ignore package versions published less than 3 days ago
minimumReleaseAge: 4320

resolutionMode: highest

allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  sharp: true
  ssh2: true
  unrs-resolver: true

auditConfig:
  ignoreGhsas:
    # node-forge RSA PKCS#1 v1.5 signature *verification* bypass. No patched
    # release is published yet (latest is 1.4.0). Only reached via
    # passkit-generator, which uses node-forge to sign passes, never to verify.
    - GHSA-86w9-cpqp-85rv
    # braces stack-exhaustion DoS on deeply nested patterns. No patched release
    # is published yet (latest is 3.0.3). Dev-only (vercel CLI, eslint), so it
    # never reaches the --prod gate; ignored so the weekly full audit only goes
    # red for new findings. Drop this once braces 3.0.4 ships.
    - GHSA-vfj7-8cjw-p6xm

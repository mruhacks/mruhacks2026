overrides:
  react-hook-form: ^7.65.0
  '@hookform/resolvers': ^5.2.2
  esbuild: ^0.28.2
  postcss: ^8.5.26
  nanoid: ^3.3.18
  js-yaml: ^4.3.1
  sharp: ^0.35.3
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.4
  brace-expansion@5: ^5.0.9

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - unrs-resolver

# 72-hour cooldown: ignore package versions published less than 3 days ago
minimumReleaseAge: 4320

resolutionMode: highest

allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  sharp: true
  ssh2: true
  unrs-resolver: true
